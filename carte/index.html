<style>

    width: 100%;
    padding: 7px 10px 7px 26px;
    font-family: inherit;
    font-size: 12px;
    background: var(--bg-grain);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--ink-soft); }
  .search-wrap::before {
    content: '';
    position: absolute;
    left: 9px; top: 50%;
    width: 11px; height: 11px;
    border: 1.4px solid var(--ink-faint);
    border-radius: 50%;
    transform: translateY(-65%);
    pointer-events: none;
  }
  .search-wrap::after {
    content: '';
    position: absolute;
    left: 18px; top: 50%;
    width: 5px; height: 1.4px;
    background: var(--ink-faint);
    transform: translate(0, 4px) rotate(45deg);
    transform-origin: left center;
    pointer-events: none;
  }
  .search-hint {
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 5px;
    line-height: 1.35;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
    font-size: 11.5px;
    color: var(--ink-soft);
    transition: color 0.15s;
  }
  .legend-item:hover { color: var(--ink); }
  .legend-item.off { opacity: 0.35; text-decoration: line-through; }
  .legend-item .swatch {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 18px;
  }
  .legend-item .count {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    font-size: 10.5px;
  }

  .size-legend { padding: 4px 2px 2px 2px; }
  .size-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 5px 0;
  }
  .size-row .dot-wrap { width: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .size-row .dot {
    display: inline-block;
    border-radius: 50%;
    background: var(--c-editeur);
    opacity: 0.82;
    border: 1px solid var(--ink);
  }
  .size-row .lbl { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .size-caption {
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 6px;
    line-height: 1.35;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 3px 0;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .stat-row .num {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 36;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .controls {
    position: absolute;
    bottom: 56px; left: 24px;
    display: flex;
    gap: 8px;
    z-index: 500;
  }
  .ctrl {
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .ctrl:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 32px;
    z-index: 490;
    background: linear-gradient(to top, rgba(244,239,228,0.96) 0%, rgba(244,239,228,0.85) 60%, transparent 100%);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    pointer-events: none;
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  footer > * { pointer-events: auto; }
  footer .sources { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  footer .sources-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  footer .source-tag {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink);
    font-size: 10px;
    border-bottom: 1px dotted var(--ink-faint);
    cursor: help;
  }
  footer .source-tag:hover { color: var(--highlight); border-color: var(--highlight); }
  footer .credit {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 14;
    font-style: italic;
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
    text-align: right;
    line-height: 1.6;
  }

  /* Popup (infobulle) — ouvert au clic sur un cercle */
  .leaflet-popup-content-wrapper {
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 2px;
    box-shadow: 4px 4px 0 rgba(26,24,20,0.12);
  }
  .leaflet-popup-tip { background: var(--paper); border: 1px solid var(--ink); }
  .leaflet-popup-content {
    margin: 12px 14px;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--ink);
    max-width: 320px;
    max-height: 62vh;
    overflow-y: auto;
  }
  .leaflet-popup-close-button {
    color: var(--ink-faint) !important;
    font-size: 18px !important;
  }

</style>
</head>
<body><div id="app">
<header>
<div class="eyebrow">Réseau de propriété</div>
<h1>Médias <em>d'information</em> du Québec</h1>
<p class="subtitle">Carte interactive by <strong>JH Roy</strong> | Données mises à jour le 3 décembre 2024</p>
</header>
<div id="map"></div>
<aside>
<h2>Filtre</h2>
<div class="search-wrap">
<input type="search" id="search" placeholder="Chercher...">
</div>
<p class="search-hint">Cherchez par nom, ville, région ou type.</p>
<h2>Légende</h2>
<div id="legend"></div>
<h2>Statistiques</h2>
<div id="stats"></div>
</aside>
<div class="controls">
<button class="ctrl" id="resetBtn">Réinitialiser</button>
</div>
<footer>
<div class="sources">
<span class="sources-label">Sources :</span>
<span class="source-tag" title="Statut : Mis à jour le 3 décembre 2024. Ces données proviennent d'une base de données JSON créée en 2024.">Données maison</span>
</div>
<div class="credit">
Jean-Hugues Roy<br/>2024
</div>
</footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
// ====== DATA ======
const DATA = [
[…]
];
// ============
const colorMap = {
  editeur: '#1c2c4f',
  radiodiff: '#2d4a3e',
  station: '#d6cfba',
  publication: '#cdc4ad',
  plateforme: '#b8c6c6',
  individu: '#9e2a2a',
  autre: '#856b3d',
  reseau: '#5d7a8c',
  inconnu: '#b0a890'
};

const typeLabels = {
  editeur: 'Éditeur multimédias',
  radiodiff: 'Radiodiffuseur',
  station: 'Station locale',
  publication: 'Publication',
  plateforme: 'Plateforme',
  individu: 'Individu',
  autre: 'Autre',
  reseau: 'Réseau',
  inconnu: 'Type inconnu'
};

let filteredData = [...DATA];
let markersLayer;
let map;

function getMarkerRadius(nbMedias) {
  if (nbMedias === 1) return 6;
  if (nbMedias <= 3) return 8;
  if (nbMedias <= 8) return 11;
  if (nbMedias <= 20) return 15;
  return 20;
}

function initMap() {
  const map = L.map('map', { attributionControl: false, zoomControl: false, minZoom: 3, maxZoom: 17 })
    .setView([48.5, -71.5], 6);
  L.control.zoom({ position: 'topleft' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  markersLayer = L.featureGroup().addTo(map);
  return map;
}

function createMarker(org, color) {
  const radius = getMarkerRadius(org.medias.length);
  return L.circleMarker([org.lat, org.lng], {
    radius: radius,
    fillColor: color,
    color: '#1a1814',
    weight: 1.5,
    opacity: 0.9,
    fillOpacity: 0.82
  });
}

function updateMarkers() {
  markersLayer.clearLayers();
  
  filteredData.forEach(org => {
    const color = colorMap[org.type_principal] || colorMap.inconnu;
    const marker = createMarker(org, color);
    
    const popupContent = `
      <strong>${org.nom}</strong><br/>
      <small>${org.ville}, ${org.province}</small><br/>
      <small><em>${typeLabels[org.type_principal] || 'Type inconnu'}</em></small><br/><br/>
      <strong>${org.medias.length} média${org.medias.length > 1 ? 's' : ''}</strong><br/>
      ${org.medias.map(m => `• ${m}`).join('<br/>')}
    `;
    
    marker.bindPopup(popupContent);
    marker.addTo(markersLayer);
  });
  
  updateStats();
}

function updateLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  
  const typeCounts = {};
  DATA.forEach(org => {
    const type = org.type_principal || 'inconnu';
    typeCounts[type] = (typeCounts[type] || 0) + 1;
  });
  
  Object.keys(typeCounts)
    .sort((a, b) => typeCounts[b] - typeCounts[a])
    .forEach(type => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.type = type;
      item.innerHTML = `
        <div class="swatch" style="background-color: ${colorMap[type]}; border: 1px solid #1a1814; border-radius: 2px;"></div>
        <span>${typeLabels[type] || 'Type inconnu'}</span>
        <span class="count">${typeCounts[type]}</span>
      `;
      item.addEventListener('click', () => toggleType(type, item));
      legend.appendChild(item);
    });
}

const disabledTypes = new Set();

function toggleType(type, element) {
  if (disabledTypes.has(type)) {
    disabledTypes.delete(type);
    element.classList.remove('off');
  } else {
    disabledTypes.add(type);
    element.classList.add('off');
  }
  applyFilters();
}

function updateStats() {
  const stats = document.getElementById('stats');
  const totalOrgs = filteredData.length;
  const totalMedias = filteredData.reduce((sum, org) => sum + org.medias.length, 0);
  
  stats.innerHTML = `
    <div class="stat-row">
      <span>Organisations</span>
      <span class="num">${totalOrgs}</span>
    </div>
    <div class="stat-row">
      <span>Médias</span>
      <span class="num">${totalMedias}</span>
    </div>
  `;
}

function applyFilters() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  
  filteredData = DATA.filter(org => {
    if (disabledTypes.has(org.type_principal || 'inconnu')) return false;
    
    if (searchTerm) {
      const searchable = [
        org.nom,
        org.ville,
        org.province,
        typeLabels[org.type_principal] || '',
        ...org.medias
      ].join(' ').toLowerCase();
      
      if (!searchable.includes(searchTerm)) return false;
    }
    
    return true;
  });
  
  updateMarkers();
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  disabledTypes.clear();
  document.querySelectorAll('.legend-item').forEach(item => {
    item.classList.remove('off');
  });
  applyFilters();
});

map = initMap();
updateLegend();
updateMarkers();
</script>
</body>
</html>
